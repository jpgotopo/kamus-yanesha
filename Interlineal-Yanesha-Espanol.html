"gaza":["Gaza"],"amonita":["Amonitaneshá","Moab","Amonita"],"astarté":["Astarot"],"peniná":["Penina"],"faraón":["Faraón"],"seror":["Zeror"],"siclag":["Siclag"],"quis":["Cis"],"quiriat-jearim":["Quiriat-jearim"],"quenita":["Quenita"],"ramat del neguev":["Ramat"],"raquel":["Raquel"],"racal":["Racal"],"ramá":["Rama"],"ramataim de zofim":["Ramatáyeño"],"ramot del négueb":["Ramot"],"siló":["Silo","Silot̃"],"sifmot":["Sifmot"],"sen":["Sen"],"secú":["Secú"],"samá":["Sama"],"saaraim":["Saaraim"],"saúl":["Saúl","Saúleshó"],"salisá":["Salisa"],"sunem":["Sunem"],"jehova":["huom̃chena"],"eli":["elí"],"mi":["coyaneshá"],"me":["ñeñt̃ómarña"],"isrrael":["israel"],"la":["att̃ó","sherbets"],"ofrendas":["allo"],"nos":["ña"]}};
const UI = {"btn_swap": "Invertir", "btn_copy_tr": "Copiar la traducción", "btn_copy_il": "Copiar el interlineal", "btn_copy": "Copiar", "btn_clear": "Limpiar", "lbl_translation": "Traducción aproximada", "placeholder_out": "El resultado aparecerá aquí…", "ph_gloss": "significado…", "opt_own": "✎ escribir el mío…", "tip_edit": "Escribir o cambiar el significado", "tip_join": "Unir con la palabra siguiente", "tip_split": "Volver a separar", "stat_found": "{found}/{total} unidades encontradas ({pct}%)", "no_text": "No hay texto", "copy_fail": "No se pudo copiar", "toast_tr": "Traducción copiada ✓", "toast_il": "Interlineal copiado ✓", "legend": "Las frases conocidas se unen solas — recuadro de borde azul.<br><b>⊕</b> unir esta palabra con la siguiente · <b>⊝</b> volver a separar · <b>✎</b> escribir o cambiar el significado (se guarda solo).<br>Subrayado punteado = hay varios significados; pulsa para elegir. Recuadro rojo = no encontrado.", "ph_src": "Escribe un texto en Yanesha'…", "ph_gl": "Escribe un texto en español…"};
const SRC_SUF = [];      // sufijos de la lengua vernácula
const GL_SUF  = ["s", "es", "as", "os"];    // afijos de la lengua de glosa
const GL_PRE  = [];
let dir="t2i", UNITS=[];
const EDIT_OPT="__edit__";

function T(key,vars){let s=UI[key]||key;for(const k in (vars||{}))s=s.split("{"+k+"}").join(vars[k]);return s;}

function maxWords(map){let m=1;for(const k in map){const n=k.split(" ").length;if(n>m)m=n;}return m;}
const MAXN={t2i:Math.min(6,maxWords(DATA.t2i)),i2t:Math.min(6,maxWords(DATA.i2t))};
function buildAlt(map){const a={};for(const k in map){const s=k.replace(/['’]/g,"");if(!(s in map))a[s]=k;}return a;}
const ALT={t2i:buildAlt(DATA.t2i),i2t:buildAlt(DATA.i2t)};

// glosas propias del usuario (persistentes)
let CUSTOM={};
try{CUSTOM=JSON.parse(localStorage.getItem("il_custom")||"{}");}catch(e){CUSTOM={};}
function ckey(k){return dir+""+k;}
function saveCustom(){try{localStorage.setItem("il_custom",JSON.stringify(CUSTOM));}catch(e){}}

function glossStems(w){const out=[w];
  for(const s of GL_SUF){if(w.endsWith(s)&&w.length-s.length>=2)out.push(w.slice(0,-s.length));}
  for(const p of GL_PRE){if(w.startsWith(p)&&w.length-p.length>=3)out.push(w.slice(p.length));}
  return out;}
function lookupExact(key){const m=DATA[dir],a=ALT[dir],k=key.toLowerCase();
  if(m[k])return m[k];const b=k.replace(/['’]/g,"");if(a[b])return m[a[b]];return null;}
function lookupWord(w){let r=lookupExact(w);if(r)return r;const m=DATA[dir],a=ALT[dir];
  if(dir==="i2t"){for(const st of glossStems(w.toLowerCase())){if(m[st])return m[st];if(a[st])return m[a[st]];}}
  else{const lw=w.toLowerCase();for(const suf of SRC_SUF){
    if(lw.endsWith(suf)&&lw.length-suf.length>=3){const st=lw.slice(0,-suf.length);
      if(m[st])return m[st];const sb=st.replace(/['’]/g,"");if(a[sb])return m[a[sb]];}}}
  return null;}

function esc(s){return (s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
// \p{M} incluye las marcas combinantes: ortografías como la yanesha escriben
// t̃ m̃ p̃ c̈h con tilde/diéresis combinante, y sin esto "Ahuat̃" se parte en dos.
function tokenize(t){return t.match(/[\p{L}\p{M}'’]+|[^\p{L}\p{M}\s]+|\s+/gu)||[];}
function isWord(t){return /[\p{L}]/u.test(t)&&!/^\s+$/.test(t);}

function makeWordUnit(raw,cands,found,manual){
  const key=raw.toLowerCase();
  const u={t:"word",raw,key,cands:(cands||[]).slice(0,6),sel:0,found,manual:!!manual,custom:null};
  const c=CUSTOM[ckey(key)];
  if(c){u.custom=c;}
  return u;
}

function buildModel(){
  const toks=tokenize(document.getElementById("in").value);
  UNITS=[];
  let i=0;
  while(i<toks.length){
    const t=toks[i];
    if(/^\s+$/.test(t)){UNITS.push({t:"space",raw:t});i++;continue;}
    if(!isWord(t)){UNITS.push({t:"punct",raw:t});i++;continue;}
    const run=[i];let j=i+1;
    while(j+1<toks.length && /^\s+$/.test(toks[j]) && isWord(toks[j+1])){run.push(j+1);j+=2;}
    let L=Math.min(MAXN[dir],run.length),matched=null;
    for(;L>=2;L--){const key=run.slice(0,L).map(x=>toks[x].toLowerCase()).join(" ");
      const r=lookupExact(key);if(r){matched={L,r};break;}}
    if(matched){
      const raw=toks.slice(run[0],run[matched.L-1]+1).join("");
      UNITS.push(makeWordUnit(raw,matched.r,true));
      i=run[matched.L-1]+1;
    }else{
      const r=lookupWord(t);
      UNITS.push(makeWordUnit(t,r||[],!!(r&&r.length)));
      i++;
    }
  }
}

function effGloss(u){
  if(u.custom) return u.custom;
  if(u.found && u.cands.length) return u.cands[u.sel]||u.cands[0];
  return "["+u.raw+"]";
}

function renderTokens(){
  let html="",nW=0,nF=0;
  UNITS.forEach((u,i)=>{
    if(u.t==="space")return;
    if(u.t==="punct"){html+=`<span class="punc">${esc(u.raw)}</span>`;return;}
    nW++;
    const phrase=/\s/.test(u.raw.trim())||u.manual;
    const cls="tok"+(u.found||u.custom?"":" unk")+(phrase?" phrase":"")+(u.custom?" cust":"");
    let gloss;
    if(u.editing){
      gloss=`<input class="gedit" data-i="${i}" value="${esc(effGloss(u)==='['+u.raw+']'?'':effGloss(u))}" placeholder="${esc(UI.ph_gloss)}">`;
    }else if(u.custom){
      gloss=`<span class="g">${esc(u.custom)}</span>`;
    }else if(u.found && u.cands.length>1){
      const opts=u.cands.map((c,j)=>`<option value="${j}"${j===u.sel?" selected":""}>${esc(c)}</option>`).join("")
        +`<option value="${EDIT_OPT}">${esc(UI.opt_own)}</option>`;
      gloss=`<select class="gsel" data-i="${i}">${opts}</select>`;
    }else if(u.found){
      gloss=`<span class="g">${esc(u.cands[0])}</span>`;
    }else{
      gloss=`<span class="g">?</span>`;
    }
    const hasNextWord = UNITS.slice(i+1).some(x=>x.t==="word");
    let ctl=`<span class="ctl">`;
    if(!u.editing) ctl+=`<button data-act="edit" data-i="${i}" title="${esc(UI.tip_edit)}">✎</button>`;
    if(hasNextWord && !u.editing) ctl+=`<button data-act="join" data-i="${i}" title="${esc(UI.tip_join)}">⊕</button>`;
    if(u.manual && !u.editing) ctl+=`<button data-act="split" data-i="${i}" title="${esc(UI.tip_split)}">⊝</button>`;
    ctl+=`</span>`;
    html+=`<span class="${cls}"><span class="s">${esc(u.raw)}</span>${gloss}${ctl}</span>`;
    if(u.found||u.custom)nF++;
  });
  document.getElementById("il").innerHTML=html||`<span class="hint">${esc(UI.placeholder_out)}</span>`;
  updateTranslation(nW,nF);
}

function updateTranslation(nW,nF){
  let tr="";
  UNITS.forEach(u=>{
    if(u.t==="space"){tr+=" ";return;}
    if(u.t==="punct"){tr=tr.replace(/\s$/,"")+u.raw;return;}
    tr+=(tr&&!tr.endsWith(" ")?" ":"")+effGloss(u);
  });
  tr=tr.replace(/\s+/g," ").trim();
  if(nW===undefined){nW=UNITS.filter(u=>u.t==="word").length;nF=UNITS.filter(u=>u.t==="word"&&(u.found||u.custom)).length;}
  const trBox=document.getElementById("tr");
  if(nW>0){trBox.style.display="block";document.getElementById("trtxt").textContent=tr;}else trBox.style.display="none";
  document.getElementById("stat").textContent=nW?T("stat_found",{found:nF,total:nW,pct:Math.round(100*nF/nW)}):"";
  window.__lastTR=tr;
  window.__lastIL=UNITS.filter(u=>u.t==="word").map(u=>`${u.raw} = ${u.custom||(u.found?effGloss(u):"?")}`).join("\n");
}

function refresh(){buildModel();renderTokens();}

const il=document.getElementById("il");
il.addEventListener("change",e=>{
  const sel=e.target.closest(".gsel");if(!sel)return;
  const i=+sel.dataset.i;
  if(sel.value===EDIT_OPT){UNITS[i].editing=true;renderTokens();focusEdit(i);return;}
  UNITS[i].sel=+sel.value;updateTranslation();
});
il.addEventListener("click",e=>{
  const b=e.target.closest("button[data-act]");if(!b)return;
  const i=+b.dataset.i,act=b.dataset.act;
  if(act==="edit"){UNITS[i].editing=true;renderTokens();focusEdit(i);}
  else if(act==="join"){joinNext(i);}
  else if(act==="split"){splitUnit(i);}
});
il.addEventListener("keydown",e=>{
  if(!e.target.classList.contains("gedit"))return;
  if(e.key==="Enter"){e.preventDefault();commitEdit(+e.target.dataset.i,e.target.value);}
  else if(e.key==="Escape"){const i=+e.target.dataset.i;UNITS[i].editing=false;renderTokens();}
});
il.addEventListener("blur",e=>{
  if(e.target.classList&&e.target.classList.contains("gedit"))commitEdit(+e.target.dataset.i,e.target.value);
},true);

function focusEdit(i){const inp=il.querySelector(`.gedit[data-i="${i}"]`);if(inp){inp.focus();inp.select();}}
function commitEdit(i,val){
  const u=UNITS[i];if(!u||u.t!=="word")return;
  val=(val||"").trim();
  u.editing=false;
  if(val){u.custom=val;u.found=true;CUSTOM[ckey(u.key)]=val;saveCustom();}
  else{u.custom=null;delete CUSTOM[ckey(u.key)];saveCustom();}
  renderTokens();
}
function joinNext(i){
  let j=i+1;while(j<UNITS.length&&UNITS[j].t!=="word"){j++;}
  if(j>=UNITS.length)return;
  const sepRaw=UNITS.slice(i+1,j).map(x=>x.raw).join("")||" ";
  const raw=(UNITS[i].raw+sepRaw+UNITS[j].raw);
  const key=raw.toLowerCase().replace(/\s+/g," ").trim();
  const r=lookupExact(key);
  const u=makeWordUnit(raw,r||[],!!(r&&r.length),true);
  UNITS.splice(i,j-i+1,u);
  renderTokens();
}
function splitUnit(i){
  const raw=UNITS[i].raw;
  const toks=tokenize(raw);
  const repl=[];let k=0;
  while(k<toks.length){const t=toks[k];
    if(/^\s+$/.test(t)){repl.push({t:"space",raw:t});k++;continue;}
    if(!isWord(t)){repl.push({t:"punct",raw:t});k++;continue;}
    const r=lookupWord(t);repl.push(makeWordUnit(t,r||[],!!(r&&r.length)));k++;}
  UNITS.splice(i,1,...repl);
  renderTokens();
}

function toast(m){const t=document.getElementById("toast");t.textContent=m;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),1400);}
async function copy(txt,msg){if(!txt){toast(UI.no_text);return;}
  try{await navigator.clipboard.writeText(txt);toast(msg);}
  catch(e){const ta=document.createElement("textarea");ta.value=txt;document.body.appendChild(ta);ta.select();
    try{document.execCommand("copy");toast(msg);}catch(_){toast(UI.copy_fail);}document.body.removeChild(ta);}}

document.getElementById("in").addEventListener("input",refresh);
document.getElementById("seg").addEventListener("click",e=>{if(!e.target.dataset.d)return;dir=e.target.dataset.d;
  [...document.querySelectorAll("#seg button")].forEach(b=>b.classList.toggle("active",b.dataset.d===dir));updatePH();refresh();});
document.getElementById("swap").addEventListener("click",()=>{dir=dir==="t2i"?"i2t":"t2i";
  [...document.querySelectorAll("#seg button")].forEach(b=>b.classList.toggle("active",b.dataset.d===dir));updatePH();refresh();});
function updatePH(){document.getElementById("in").placeholder=dir==="t2i"?UI.ph_src:UI.ph_gl;}

// etiquetas fijas
document.getElementById("swap").textContent="⇄ "+UI.btn_swap;
document.getElementById("copyT").textContent=UI.btn_copy_tr;
document.getElementById("copyIL").textContent=UI.btn_copy_il;
document.getElementById("clear").textContent=UI.btn_clear;
document.getElementById("trlbl").textContent=UI.lbl_translation;
document.getElementById("copyT2").textContent="📋 "+UI.btn_copy;
document.getElementById("legend").innerHTML=UI.legend;

document.getElementById("copyT").addEventListener("click",()=>copy(window.__lastTR,UI.toast_tr));
document.getElementById("copyT2").addEventListener("click",()=>copy(window.__lastTR,UI.toast_tr));
document.getElementById("copyIL").addEventListener("click",()=>copy(window.__lastIL,UI.toast_il));
document.getElementById("clear").addEventListener("click",()=>{document.getElementById("in").value="";refresh();document.getElementById("in").focus();});
updatePH();refresh();
</script>
